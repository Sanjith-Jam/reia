[package]
name = "reia"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A local Gemma assistant for WhatsApp chats, checklists, and coding tasks"
repository = "https://github.com/Sanjith-Jam/reia"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
keyring = "3"
log = "0.4"
qrcode = "0.14"
rand = "0.9"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util", "process"] }
toml = "0.9"
hex = "0.4"
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f7468ae2920a2b0aedbd0848cf121de56a07f93c", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
